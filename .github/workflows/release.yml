name: Release

# Publishing is driven by a version tag (`git tag v0.1.0 && git push --tags`).
# Provenance is published from GitHub Actions (this repo is public).
#
# AUTHENTICATION: OIDC trusted publishing. This repo holds **no npm token** --
# the workflow exchanges a GitHub Actions OIDC token for a short-lived publish
# credential, and that same flow produces the provenance statement. The trust
# relationship is configured per package on npm:
#   npm trust github @sol-fab/kafka --file release.yml --allow-publish
#
# Do NOT reintroduce NODE_AUTH_TOKEN. npm's guidance is explicit that it must not
# be set when OIDC is in use, and a stray empty token makes npm attempt token
# auth instead of falling through to OIDC.
#
# v0.1.0 was the single exception: it was published with a bootstrap token,
# because a trusted publisher can only be attached to a package that already
# exists on the registry.
#
# @sol-fab/obs must already be published at a satisfying version before this
# can succeed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11.x. OIDC trusted publishing requires npm
          # >= 11.5.1; every Node 22 release ships npm 10.9.8.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --access public --provenance
