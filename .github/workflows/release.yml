name: Release

# Publishing is driven by a version tag (`git tag v0.1.0 && git push --tags`).
# The npm token lives in the repository secret NPM_TOKEN; provenance is
# published from GitHub Actions (this repo is public). @sol-fab/obs must
# already be published at a satisfying version before this can succeed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
